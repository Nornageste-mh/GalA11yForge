; ============================================================================
;  kkz-adapter.example.ini -- task-49 / W2-Y
;
;  用法：复制成 <游戏目录>\plugin\kkz-adapter.ini（与代理 DLL 同目录），
;        或设环境变量 KKZ_ADAPTER_INI=<绝对路径> 指向它。
;  本文件是【纯 ASCII】，可直接按 UTF-8/ANSI 保存。若某个值含中文路径，
;  必须把整个 ini 另存为 UTF-16LE（带 BOM），否则 GetPrivateProfileStringW
;  会按当前 ANSI 代码页读成乱码。install.ps1 默认就用 UTF-16LE 写。
;
;  所有键都是可选的：没写就用 DLL 的编译期默认值（README 里有表）。
; ============================================================================

[adapter]
; 被代理的插件文件名（必须与本 DLL 的文件名完全一致，否则安全门①拒绝注入）
TargetDll=getSample.dll

; 原 DLL 的后缀：原名 getSample.dll -> getSample_orig.dll
OrigSuffix=_orig

; TJS 只读轮询间隔（毫秒）。task-47 实测 100~400 都稳；默认 200。
PollMs=200

; 稳定化：同一段文本连续 StabilizeMs 毫秒不变才落盘（滤逐字动画的中间态）
StabilizeMs=200

; 少于这么多字符的行直接丢弃（滤掉空行和单字中间态）
MinChars=2

; 最多落盘多少行；0 = 不限
MaxRows=0

; 文本落盘位置（UTF-8，一行一条，Tab 分隔：seq、stable、name、text、plaintext）
OutputFile=%TEMP%\kkz_adapter_capture.txt

; 健康检查日志（key=value）。想知道"为什么不工作"就看这个文件。
LogFile=%TEMP%\kkz_adapter_probe.txt

; 0 = 只落盘不朗读；1 = 落盘同时用进程内 SAPI 朗读（DLL 必须用 -EnableTts 编译，
; 否则本开关无效果，日志里不会有 tts_* 行）
EnableTts=0

; ---- 安全门（全部满足才注入；不满足 = 只转发原插件，游戏照常跑）----
; 宿主 exe 文件名（不含路径）；留空 = 不校验
RequireExe=
; 宿主 exe 文件版本前缀，支持 "1.2.*"；留空 = 不校验
RequireExeVersion=
; 原 DLL 的 SHA-256（十六进制，大小写不敏感）；留空 = 不校验。强烈建议填。
RequireOrigSha256=

; 安全门不过时的行为：
;   degraded（默认）= 不注入，但仍 LoadLibrary 原 DLL 并转发，游戏能玩
;   strict          = 直接返回失败，让引擎认为插件加载失败
FailMode=degraded

[text]
; 三条 TJS 只读表达式。task-47 实测：1.2.0.3 上只有 plaintext 有内容，
; disp / text 整轮为空（保留可配置是为了别的 KKZ 版本）。
; 绝不能写会创建对象的表达式（new Object() => 0xC0000409）。
ExprName=global.kag.historyLayer.currentInfo.disp
ExprText=global.kag.historyLayer.currentInfo.text
ExprPlain=global.kag.historyLayer.currentInfo.plaintext
